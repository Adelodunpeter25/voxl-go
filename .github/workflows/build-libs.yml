name: Build libs

# Builds a self-contained libvoxl.so / libvoxl.dylib per target (x264, Opus and libyuv are
# compiled from source by scripts/build-deps.sh and linked in statically) and commits it to
# libs/<target-triple>/ for the Go module. Built without the pulseaudio feature: the C API
# streams video and takes input only, and this keeps libpulse out of the dependencies.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # The commit job pushes libs/ back to main; don't rebuild because of it.
    paths-ignore: ['libs/**', '**.md']
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-gnu:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          # Native arm64 runner: no cross-compilation sysroot to maintain.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake nasm libclang-dev pkg-config
      # build.rs bundles web/src with esbuild.
      - run: npm install -g esbuild
      - run: scripts/build-deps.sh "$PWD/deps"
      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          # libyuv has no .pc file and is C++.
          RUSTFLAGS: -L native=${{ github.workspace }}/deps/lib -C link-arg=-lstdc++
        run: cargo build --release --lib --locked --no-default-features
      - name: Collect and check
        run: |
          d=libs/${{ matrix.target }}; mkdir -p $d
          cp target/release/libvoxl.so target/release/libvoxl.a $d/
          ldd $d/libvoxl.so
          if ldd $d/libvoxl.so | grep -E 'x264|opus|yuv|pulse'; then echo "::error::dependency not linked statically"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'libs-${{ matrix.target }}', path: 'libs/${{ matrix.target }}' }

  linux-musl:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      # Alpine is musl natively, so the library built there is a real musl one.
      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -ec '
            apk add --no-cache rust cargo build-base pkgconf clang-dev cmake nasm git esbuild linux-headers
            scripts/build-deps.sh /w/deps
            export PKG_CONFIG_PATH=/w/deps/lib/pkgconfig PKG_CONFIG_ALL_STATIC=1
            # A cdylib on musl needs the C runtime linked dynamically.
            export RUSTFLAGS="-C target-feature=-crt-static -L native=/w/deps/lib -C link-arg=-lstdc++"
            cargo build --release --lib --locked --no-default-features
          '
      - name: Collect and check
        run: |
          d=libs/${{ matrix.target }}; mkdir -p $d
          sudo cp target/release/libvoxl.so target/release/libvoxl.a $d/
          sudo chown -R $USER $d
          readelf -d $d/libvoxl.so | grep NEEDED
          if readelf -d $d/libvoxl.so | grep -E 'x264|opus|yuv'; then echo "::error::dependency not linked statically"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'libs-${{ matrix.target }}', path: 'libs/${{ matrix.target }}' }

  macos:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install cmake nasm pkg-config esbuild
      - run: scripts/build-deps.sh "$PWD/deps"
      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          RUSTFLAGS: -L native=${{ github.workspace }}/deps/lib
        run: cargo build --release --lib --locked --no-default-features
      - name: Collect and check
        run: |
          d=libs/${{ matrix.target }}; mkdir -p $d
          cp target/release/libvoxl.dylib target/release/libvoxl.a $d/
          # Found through the rpath the Go module adds, not the build machine's path.
          install_name_tool -id @rpath/libvoxl.dylib $d/libvoxl.dylib
          otool -L $d/libvoxl.dylib
          if otool -L $d/libvoxl.dylib | grep -E '/opt/homebrew|/usr/local|x264|opus'; then echo "::error::links a non-system dylib"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'libs-${{ matrix.target }}', path: 'libs/${{ matrix.target }}' }

  commit:
    needs: [linux-gnu, linux-musl, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: 'libs-*', path: libs }
      - name: Flatten and commit
        run: |
          for d in libs/libs-*; do rm -rf "libs/${d#libs/libs-}"; mv "$d" "libs/${d#libs/libs-}"; done
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f libs
          git commit -m "Update prebuilt libs" || exit 0
          git push
